<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kōhi — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0806; --surface: #13100d; --border: #2c241a; --text: #ede8df; --muted: #8a7c6e; --accent: #c8a04a; --error: #d96b6b; }
    body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 2.5rem 2rem; }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand a { font-family: 'Noto Serif JP', serif; font-size: 1.75rem; font-weight: 300; color: var(--text); text-decoration: none; letter-spacing: 0.1em; }
    .brand a span { color: var(--accent); }
    h2 { font-family: 'Noto Serif JP', serif; font-size: 0.8rem; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 2rem; }
    label { display: block; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
    .field { margin-bottom: 1.25rem; }
    input[type="email"], input[type="password"] { display: block; width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 2px; padding: 0.7rem 0.9rem; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 300; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #3e342a; }
    .btn-submit { width: 100%; padding: 0.85rem; margin-top: 0.5rem; background: var(--accent); color: var(--bg); border: none; border-radius: 2px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.8rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover:not(:disabled) { background: #dbb55e; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { display: none; margin-top: 1.25rem; padding: 0.8rem 1rem; border-radius: 2px; font-size: 0.85rem; text-align: center; background: rgba(217,107,107,0.12); border: 1px solid rgba(217,107,107,0.3); color: var(--error); }
    .footer-link { display: block; text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.08em; }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand"><a href="/">K<span>ō</span>hi</a></div>
    <h2>Iniciar sesión</h2>
    <form id="form">
      <div class="field"><label for="email">Correo electrónico</label><input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email"></div>
      <div class="field"><label for="password">Contraseña</label><input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"></div>
      <button type="submit" class="btn-submit" id="submit-btn">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="footer-link">¿Aún no tienes cuenta? <a href="/register.html">Reservar lugar</a></p>
  </div>
  <script>
    const form = document.getElementById('form');
    const msgDiv = document.getElementById('msg');
    const submitBtn = document.getElementById('submit-btn');
    const card = document.getElementById('card');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      msgDiv.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      submitBtn.disabled = true; submitBtn.textContent = 'Verificando…';
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) {
          msgDiv.textContent = data.error || 'Credenciales inválidas.'; msgDiv.style.display = 'block';
          card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
          submitBtn.disabled = false; submitBtn.textContent = 'Entrar'; return;
        }
        localStorage.setItem('kohi_token', data.token);
        window.location.href = '/dashboard.html';
      } catch { msgDiv.textContent = 'Error de conexión.'; msgDiv.style.display = 'block'; submitBtn.disabled = false; submitBtn.textContent = 'Entrar'; }
    });
  </script>
</body>
</html>
