<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kōhi — Café de Especialidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0806;
      --surface:   #13100d;
      --border:    #2c241a;
      --text:      #ede8df;
      --muted:     #8a7c6e;
      --accent:    #c8a04a;
      --accent-dk: #9e7d38;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', 'Helvetica Neue', sans-serif;
      font-weight: 300;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .wrapper { position: relative; z-index: 1; max-width: 520px; width: 100%; }

    .kana {
      display: block;
      font-family: 'Noto Serif JP', serif;
      font-size: 0.75rem;
      letter-spacing: 0.5em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      opacity: 0.8;
    }

    h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(4rem, 14vw, 7rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    h1 span { color: var(--accent); }

    .tagline {
      font-size: 1rem;
      letter-spacing: 0.28em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 1.5rem auto;
    }

    .philosophy {
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--muted);
      max-width: 380px;
      margin: 0 auto 2.75rem;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      border-radius: 2px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border: 1px solid var(--accent);
    }
    .btn-primary:hover { background: #dbb55e; border-color: #dbb55e; }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--border);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <span class="kana">コーヒー</span>
    <h1>K<span>ō</span>hi</h1>
    <p class="tagline">Café de especialidad &nbsp;·&nbsp; Próxima apertura</p>
    <div class="divider"></div>
    <p class="philosophy">
      Cada taza es una pausa. Granos de origen único,
      extracción precisa y la quietud del ritual japonés.
      Una experiencia que comienza antes del primer sorbo.
    </p>
    <div class="cta-group">
      <a href="/register.html" class="btn btn-primary">Unirme a la lista</a>
      <a href="/login.html"    class="btn btn-secondary">Ya tengo cuenta</a>
    </div>
  </div>
  <footer>Kōhi &copy; 2026 &nbsp;—&nbsp; Próxima apertura</footer>
</body>
</html>
