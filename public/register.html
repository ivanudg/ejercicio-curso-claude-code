<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kōhi — Reservar lugar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0806; --surface: #13100d; --border: #2c241a;
      --text: #ede8df; --muted: #8a7c6e; --accent: #c8a04a;
      --error: #d96b6b; --success: #7ab893;
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'Noto Sans JP', sans-serif; font-weight: 300;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem;
    }
    .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 2.5rem 2rem; }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand a { font-family: 'Noto Serif JP', serif; font-size: 1.75rem; font-weight: 300; color: var(--text); text-decoration: none; letter-spacing: 0.1em; }
    .brand a span { color: var(--accent); }
    h2 { font-family: 'Noto Serif JP', serif; font-size: 0.8rem; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 2rem; }
    label { display: block; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
    .field { margin-bottom: 1.25rem; }
    input[type="text"], input[type="email"], input[type="password"] {
      display: block; width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
      padding: 0.7rem 0.9rem; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 300; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #3e342a; }
    .btn-submit {
      width: 100%; padding: 0.85rem; margin-top: 0.5rem; background: var(--accent); color: var(--bg);
      border: none; border-radius: 2px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.8rem;
      font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: background 0.2s;
    }
    .btn-submit:hover:not(:disabled) { background: #dbb55e; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { display: none; margin-top: 1.25rem; padding: 0.8rem 1rem; border-radius: 2px; font-size: 0.85rem; line-height: 1.6; text-align: center; }
    .msg.error   { background: rgba(217,107,107,0.12); border: 1px solid rgba(217,107,107,0.3); color: var(--error); }
    .msg.success { background: rgba(122,184,147,0.12); border: 1px solid rgba(122,184,147,0.3); color: var(--success); }
    .success-view { display: none; text-align: center; padding: 1rem 0; }
    .success-view .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .success-view h3 { font-family: 'Noto Serif JP', serif; font-size: 1.1rem; font-weight: 300; color: var(--success); margin-bottom: 0.5rem; }
    .success-view .position-badge { display: inline-block; font-family: 'Noto Serif JP', serif; font-size: 3rem; font-weight: 300; color: var(--accent); line-height: 1; margin: 1rem 0; }
    .success-view p { font-size: 0.85rem; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; }
    .divider { width: 32px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 1rem auto; }
    .footer-link { display: block; text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted); text-decoration: none; letter-spacing: 0.1em; }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .btn-link { display: inline-block; padding: 0.65rem 1.5rem; border: 1px solid var(--accent); border-radius: 2px; color: var(--accent); font-family: 'Noto Sans JP', sans-serif; font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; transition: all 0.2s; }
    .btn-link:hover { background: var(--accent); color: var(--bg); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><a href="/">K<span>ō</span>hi</a></div>
    <h2>Reservar mi lugar</h2>
    <form id="form">
      <div class="field"><label for="name">Nombre</label><input type="text" id="name" placeholder="Tu nombre" required autocomplete="name"></div>
      <div class="field"><label for="email">Correo electrónico</label><input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email"></div>
      <div class="field"><label for="password">Contraseña</label><input type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password"></div>
      <div class="field"><label for="confirm">Confirmar contraseña</label><input type="password" id="confirm" placeholder="Repite la contraseña" required autocomplete="new-password"></div>
      <button type="submit" class="btn-submit" id="submit-btn">Unirme a la lista</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="success-view" id="success-view">
      <div class="icon">☕</div>
      <h3>¡Estás en la lista!</h3>
      <div class="divider"></div>
      <p class="position-badge" id="pos-num">#—</p>
      <p>Tu posición ha sido reservada.<br>Te avisaremos cuando sea tu turno.</p>
      <a href="/login.html" class="btn-link">Entrar a mi cuenta</a>
    </div>
    <p class="footer-link">¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a></p>
  </div>
  <script>
    const form = document.getElementById('form');
    const msgDiv = document.getElementById('msg');
    const submitBtn = document.getElementById('submit-btn');
    const successView = document.getElementById('success-view');
    const posNum = document.getElementById('pos-num');
    function showMsg(text, type) { msgDiv.textContent = text; msgDiv.className = `msg ${type}`; msgDiv.style.display = 'block'; }
    form.addEventListener('submit', async e => {
      e.preventDefault();
      msgDiv.style.display = 'none';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 6) return showMsg('La contraseña debe tener al menos 6 caracteres.', 'error');
      if (password !== confirm) return showMsg('Las contraseñas no coinciden.', 'error');
      submitBtn.disabled = true; submitBtn.textContent = 'Reservando…';
      try {
        const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password }) });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || 'Ocurrió un error.', 'error'); submitBtn.disabled = false; submitBtn.textContent = 'Unirme a la lista'; return; }
        posNum.textContent = `#${data.position}`;
        form.style.display = 'none'; successView.style.display = 'block';
        document.querySelector('.footer-link').style.display = 'none';
      } catch { showMsg('Error de conexión.', 'error'); submitBtn.disabled = false; submitBtn.textContent = 'Unirme a la lista'; }
    });
  </script>
</body>
</html>
